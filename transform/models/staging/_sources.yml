version: 2

sources:
  - name: raw
    description: Données brutes écrites par le script de collecte (src/ingest.py).
    schema: raw
    tables:
      - name: assets
        description: Référentiel des actifs suivis.
        columns:
          - name: symbol
            data_tests:
              - unique
              - not_null

      - name: prices
        description: Prix journaliers bruts, une ligne par actif et par jour.
        # Le pipeline doit tourner au moins tous les 3 jours (marge pour le week-end).
        loaded_at_field: ingested_at
        config:
          freshness:
            warn_after: {count: 3, period: day}
            error_after: {count: 7, period: day}

      - name: trending
        description: >
          Photo quotidienne des cryptomonnaies tendance sur CoinGecko (les plus recherchées
          sur 24 h), une ligne par jour et par cryptomonnaie.
        # Une photo par jour : au-delà de 2 jours sans photo, la collecte a un problème.
        loaded_at_field: fetched_at
        config:
          freshness:
            warn_after: {count: 2, period: day}
            error_after: {count: 7, period: day}
